name: Playwright Tests

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "*"
  pull_request:
  workflow_dispatch:
    inputs:
      use_mock_report:
        description: "Skip Playwright tests and upload a mocked HTML report"
        required: false
        default: false
        type: boolean

jobs:
  test:
    name: Web build test
    if: ${{ !((github.event_name == 'workflow_dispatch' && inputs.use_mock_report) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[mock-report]'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Setup NodeJs
        uses: actions/setup-node@v3
        with:
          node-version: "24.14.1"
      - name: Install dependencies
        run: npm ci
      - name: Ensure Rollup native optional dependency (Linux)
        if: ${{ runner.os == 'Linux' }}
        run: |
          ROLLUP_VERSION=$(node -p "require('./node_modules/rollup/package.json').version")
          npm i --no-save "@rollup/rollup-linux-x64-gnu@${ROLLUP_VERSION}"
      - name: Install Playwright Chromium Browser
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        env:
          CI: true
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
  mock_report:
    name: Mock report artifact
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.use_mock_report) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[mock-report]')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain mock trigger
        run: |
          echo "Mock report mode enabled."
          echo "- workflow_dispatch: use_mock_report=true"
          echo "- push: include [mock-report] in commit message"
      - name: Create mocked Playwright report
        run: |
          mkdir -p playwright-report
          cat > playwright-report/index.html << EOF
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>Mock Playwright Report</title>
              <style>
                body {
                  font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
                  margin: 2rem;
                  line-height: 1.5;
                }
                .card {
                  max-width: 700px;
                  border: 1px solid #d4d4d8;
                  border-radius: 12px;
                  padding: 1rem 1.25rem;
                }
              </style>
            </head>
            <body>
              <div class="card">
                <h1>Mock Playwright Report</h1>
                <p>This page is generated by CI to validate Firebase Hosting deploy.</p>
                <p>Run: ${GITHUB_RUN_ID} / Attempt: ${GITHUB_RUN_ATTEMPT}</p>
                <p>Commit: ${GITHUB_SHA}</p>
              </div>
            </body>
          </html>
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
  publish_report:
    name: Publish HTML Report
    # using always() is not ideal here, because it would also run if the workflow was cancelled
    if: ${{ !cancelled() && (needs.test.result == 'success' || needs.test.result == 'failure' || needs.mock_report.result == 'success') }}
    needs: [test, mock_report]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Download zipped HTML report
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
      - name: Add deployment metadata to avoid duplicate active-version release
        run: |
          cat > playwright-report/_ci-deploy-meta.json << EOF
          {
            "runId": "${GITHUB_RUN_ID}",
            "runAttempt": "${GITHUB_RUN_ATTEMPT}",
            "sha": "${GITHUB_SHA}",
            "createdAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
      - name: Derive Channel ID from Run ID
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        id: derive_channel
        run: |
          echo "channel=run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Report to Firebase Hosting on Push
        if: ${{ github.event_name == 'push' }}
        id: firebase_deploy
        uses: FirebaseExtended/action-hosting-deploy@v0.9.0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_GRID_EDITOR_WEB }}"
          projectId: grid-editor-web
          target: playwright-preview
          channelId: run-${{ github.run_id }}-${{ github.run_attempt }}
          expires: 1d
      - name: Output Preview URL
        if: ${{ github.event_name == 'push' }}
        run: |
          echo "::notice title=📋 Playwright Report Preview::${{ steps.firebase_deploy.outputs.details_url }}"
      - name: Report to Firebase Hosting on Pull Request
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: FirebaseExtended/action-hosting-deploy@v0.9.0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_GRID_EDITOR_WEB }}"
          projectId: grid-editor-web
          target: playwright-preview
          channelId: run-${{ github.run_id }}-${{ github.run_attempt }}
          expires: 3d

