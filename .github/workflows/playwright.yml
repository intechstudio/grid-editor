name: Playwright Tests

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "*"
  pull_request:

# only one workflow is running at the same time for each branch
# concurrency:
#   group: ${{ github.ref_name }}
#   # optional
#   cancel-in-progress: true

jobs:
  test:
    name: Web build test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup NodeJs
        uses: actions/setup-node@v3
        with:
          node-version: "24.14.1" # pin node version to avoid deployment issues
      - name: Install dependencies
        run: npm ci
      - name: Ensure Rollup native optional dependency (Linux)
        if: ${{ runner.os == 'Linux' }}
        run: |
          ROLLUP_VERSION=$(node -p "require('./node_modules/rollup/package.json').version")
          npm i --no-save "@rollup/rollup-linux-x64-gnu@${ROLLUP_VERSION}"
      - name: Install Playwright Chromium Browser
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        env:
          CI: true
          # Flag to disallow specific (e.g. MIXPANEL) services from starting in test mode
          VITE_IS_TEST: "true"
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
  publish_report:
    name: Publish HTML Report
    # using always() is not ideal here, because it would also run if the workflow was cancelled
    if: "success() || needs.test.result == 'failure'"
    needs: [test]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Setup NodeJs
        uses: actions/setup-node@v4
        with:
          node-version: "24.14.1"
      - name: Download zipped HTML report
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
      - name: Derive Channel ID from Commit SHA
        if: ${{ github.event_name == 'push' }}
        id: derive_channel
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-12)
          echo "channel=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
      - name: Report to Firebase Hosting on Push
        if: ${{ github.event_name == 'push' }}
        id: firebase_deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_GRID_EDITOR_WEB }}"
          projectId: grid-editor-web
          target: playwright-preview
          channelId: ${{ steps.derive_channel.outputs.channel }}
          expires: 1d
      - name: Output Preview URL
        if: ${{ github.event_name == 'push' }}
        run: |
          echo "::notice title=📋 Playwright Report Preview::${{ steps.firebase_deploy.outputs.details_url }}"
      - name: Report to Firebase Hosting on Pull Request
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_GRID_EDITOR_WEB }}"
          projectId: grid-editor-web
          target: playwright-preview
          expires: 3d
  # Runs alongside publish_report while Firebase is still live. Traces are
  # already limited to failures by playwright.config.js (retain-on-failure),
  # which keeps reports under the Pages 25 MiB per-file limit.
  publish_report_cloudflare:
    name: Publish HTML Report (Cloudflare)
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    needs: [test]
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Download zipped HTML report
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

      - name: Resolve deploy target
        id: target
        run: |
          branch="pr-${{ github.event.pull_request.number }}"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "url=https://$branch.grid-editor-reports.pages.dev" >> "$GITHUB_OUTPUT"

      - name: Deploy report to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy playwright-report
            --project-name=grid-editor-reports
            --branch=${{ steps.target.outputs.branch }}

      - name: Comment report URL
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: cloudflare-report
          message: |
            **Playwright report** — ${{ steps.target.outputs.url }}

