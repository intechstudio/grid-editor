name: 🚀 Release build

on:
  workflow_dispatch:
  push:
    tags:
      - "v[12].[0-9]+.[0-9]+"

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "Tag version: $TAG_VERSION"
          echo "Package.json version: $PACKAGE_VERSION"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::Version mismatch! Tag ($TAG_VERSION) does not match package.json ($PACKAGE_VERSION)"
            exit 1
          fi
          echo "Version check passed!"

  matrix-build:
    needs: version-check
    uses: ./.github/workflows/build-matrix.yml
    with:
      exportScript: export
    secrets: inherit

  publish-release:
    runs-on: ubuntu-latest
    needs: matrix-build
    steps:
      - name: Download all nightly artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*-artifact" # This will match ubuntu-latest-artifact, windows-latest-artifact, and macos-latest-artifact
          path: build/ # Path to save the downloaded artifacts
          merge-multiple: true
      - name: Remove *-artifact from file name
        run: |
          for file in $(find ./build -type f -name '*-artifact*'); do
            new_file=$(echo "$file" | sed 's/-artifact//g')
            mv "$file" "$new_file"
          done

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: build/*.*
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
