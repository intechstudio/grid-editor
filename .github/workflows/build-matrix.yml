name: Build matrix

on:
  workflow_call:
    inputs:
      exportScript:
        description: "The npm script to run for export"
        required: true
        type: string
      versionOverride:
        description: "Override package version string"
        required: false
        type: string

jobs:
  set-branch-name:
    runs-on: ubuntu-latest
    outputs:
      branch_name: ${{ steps.set-branch-name-shell.outputs.branch_name }}
    steps:
      - name: Set VITE_BRANCH_NAME
        id: set-branch-name-shell
        run: |
          if [ "${{ github.ref_type }}" == "tag" ]; then
            echo "branch_name=stable" >> $GITHUB_OUTPUT
          else
            echo "branch_name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi
        shell: bash

  matrix-build:
    needs: set-branch-name
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v3
        with:
          ref: ""
          submodules: true

      - name: Setup NodeJs
        uses: actions/setup-node@v3
        with:
          node-version: "24"
          cache: "npm"

      - name: Install python setup-tools dependency
        run: pip install setuptools
        env:
          PIP_BREAK_SYSTEM_PACKAGES: 1

      - name: Install dependencies
        run: npm ci

      - name: Install macOS usb bindings for both architectures
        # macos-latest runners are arm64, so `npm ci` only installs the
        # optionalDependency matching the host (@node-usb/usb-darwin-arm64).
        # electron-builder packages both arm64 and x64 mac targets from this
        # same node_modules (npmRebuild/nodeGypRebuild are disabled in
        # electron-builder-config.js), relying on each native package's own
        # cpu/os fields to end up in the right dmg. Without the x64 binding
        # physically present here, the x64 build ships with no usb native
        # binding at all and crashes at startup (issue #1653).
        if: runner.os == 'macOS'
        # --force is required because --os/--cpu only filter optionalDependencies
        # during a full install; npm still rejects a direct install of a package
        # whose declared os/cpu doesn't match the host (EBADPLATFORM) otherwise.
        # Both packages must go in ONE command: a second `npm install --no-save`
        # prunes the first one as extraneous, which left the x64 binding missing
        # from the shipped v1.7.3/v1.7.4 x64 builds. Do NOT pass --os/--cpu:
        # they make npm re-filter every optionalDependency for that platform
        # and remove the host's own native packages (e.g. @rollup/rollup-darwin-arm64),
        # which breaks the build.
        run: |
          USB_VERSION=$(node -p "require('./node_modules/usb/package.json').version")
          npm install --no-save --force \
            "@node-usb/usb-darwin-x64@$USB_VERSION" \
            "@node-usb/usb-darwin-arm64@$USB_VERSION"

      - name: Download LuaLS binaries
        run: node build-scripts/download-luals.js

      - name: Update package.json
        if: ${{ inputs.versionOverride != '' }}
        run: npm version ${{ inputs.versionOverride }} --no-git-tag-version

      - name: Build package
        run: npm run ${{ inputs.exportScript }}
        env:
          # gh repo token
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # windows Code signing
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

          # Apple ID
          APPLE_ID: ${{secrets.APPLE_ID}}
          APPLE_TEAM_ID: ${{secrets.APPLE_TEAM_ID}}
          APPLE_APP_SPECIFIC_PASSWORD: ${{secrets.APPLE_APP_SPECIFIC_PASSWORD}}

          # macOS Code signing
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}

          VITE_BRANCH_NAME: ${{needs.set-branch-name.outputs.branch_name}}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-artifact
          path: build/*.*

      - name: Find arm64.dmg file in build
        if: runner.os == 'macOS'
        id: find_dmg
        run: |
          FILE=$(find build -type f -name "*arm64.dmg" | head -n 1)
          echo "file=$FILE" >> $GITHUB_OUTPUT
          echo "name=$(basename "$FILE")" >> $GITHUB_OUTPUT

      - name: Upload arm64.dmg with dynamic name
        if: runner.os == 'macOS' && steps.find_dmg.outputs.file != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.find_dmg.outputs.name }}
          path: ${{ steps.find_dmg.outputs.file }}

  flatpak-build:
    needs: set-branch-name
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x64
          - os: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v3
        with:
          ref: ""
          submodules: true

      - name: Setup NodeJs
        uses: actions/setup-node@v3
        with:
          node-version: "24"
          cache: "npm"

      - name: Install python setup-tools dependency
        run: pip install setuptools
        env:
          PIP_BREAK_SYSTEM_PACKAGES: 1

      - name: Install flatpak tooling and runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder elfutils
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub \
            org.freedesktop.Platform//25.08 \
            org.freedesktop.Sdk//25.08 \
            org.electronjs.Electron2.BaseApp//25.08

      - name: Install dependencies
        run: npm ci

      - name: Update package.json
        if: ${{ inputs.versionOverride != '' }}
        run: npm version ${{ inputs.versionOverride }} --no-git-tag-version

      - name: Build flatpak
        run: |
          if [[ "${{ inputs.exportScript }}" == *nightly* ]]; then
            npm run export:flatpak:nightly
          else
            npm run export:flatpak
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_BRANCH_NAME: ${{needs.set-branch-name.outputs.branch_name}}

      # Tarball of the unpacked app for the Flathub manifest to consume.
      # The dir target ran as part of e:builder:flatpak (--linux flatpak dir),
      # so build/linux-unpacked (or linux-arm64-unpacked) already exists.
      - name: Create tarball for Flathub
        run: |
          ARCH="${{ matrix.arch }}"
          if [ "$ARCH" = "arm64" ]; then
            DIR="linux-arm64-unpacked"
          else
            DIR="linux-unpacked"
          fi
          if [[ "${{ inputs.exportScript }}" == *nightly* ]]; then
            NAME="grid-editor-nightly-linux-$ARCH.tar.gz"
          else
            NAME="grid-editor-linux-$ARCH.tar.gz"
          fi
          tar -czf "build/$NAME" -C build "$DIR"
          ls -lh "build/$NAME"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-${{ matrix.arch }}-artifact
          path: build/*.flatpak

      - name: Upload Flathub tarball artifact
        uses: actions/upload-artifact@v4
        with:
          # Intentionally not ending in "-artifact" so nightly/stable release
          # aggregation (pattern: "*-artifact") excludes this tarball.
          name: flatpak-${{ matrix.arch }}-flathub-source
          path: build/*.tar.gz
