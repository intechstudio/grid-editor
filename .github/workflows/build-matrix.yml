name: Build matrix

on:
  workflow_call:
    inputs:
      exportScript:
        description: "The npm script to run for export"
        required: true
        type: string
      versionOverride:
        description: "Override package version string"
        required: false
        type: string

jobs:
  set-branch-name:
    runs-on: ubuntu-latest
    outputs:
      branch_name: ${{ steps.set-branch-name.outputs.branch_name }}
    steps:
      - name: Set VITE_BRANCH_NAME for tag
        if: ${{ github.ref_type == 'tag' }}
        run: echo "branch_name=stable" >> $GITHUB_OUTPUT

      - name: Set VITE_BRANCH_NAME for branch
        if: ${{ github.ref_type != 'tag' }}
        run: echo "branch_name=stable" >> $GITHUB_OUTPUT

  matrix-build:
    needs: set-branch-name
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-13]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Echo branch name
        run: echo ${{needs.set-branch-name.outputs.branch_name}}
      - uses: actions/checkout@v3
        with:
          ref: ""
          submodules: true

      - name: Setup NodeJs
        uses: actions/setup-node@v3
        with:
          node-version: "18.16.1"

      - name: Install python setup-tools dependency
        run: pip install setuptools --break-system-packages

      - name: Install dependencies
        run: npm i

      - name: Update package.json
        if: ${{ inputs.versionOverride != '' }}
        run: npm version ${{ inputs.versionOverride }} --no-git-tag-version

      - name: Build package
        run: npm run ${{ inputs.exportScript }}
        env:
          # gh repo token
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # windows Code signing
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

          # Apple ID
          APPLE_ID: ${{secrets.APPLE_ID}}
          APPLE_TEAM_ID: ${{secrets.APPLE_TEAM_ID}}
          APPLE_APP_SPECIFIC_PASSWORD: ${{secrets.APPLE_APP_SPECIFIC_PASSWORD}}

          # macOS Code signing
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}

          VITE_BRANCH_NAME: ${{needs.set-branch-name.outputs.branch_name}}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-artifact
          path: build/*.*
