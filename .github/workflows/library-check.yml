name: Library Check

on:
  workflow_call:

jobs:
  library-check:
    name: Library headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true

      - name: Setup nodeJS
        uses: actions/setup-node@v3
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Every bundled library has LIB_NAME and LIB_VERSION
        run: npx vitest run src/renderer/tests/library-header.test.js
