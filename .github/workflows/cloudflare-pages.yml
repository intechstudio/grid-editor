# Builds the web editor in Actions and uploads it to Cloudflare Pages with
# wrangler (Direct Upload), so Cloudflare never builds anything and the
# monthly build limit does not apply.
#
# Deploy targets, by wrangler --branch:
#   pull request     pr-<number>   pr-<number>.grid-editor.pages.dev
#   push to stable   stable        stable.grid-editor.app
#   tag push         release       grid-editor.app
#
# The PR hostname carries the PR number only, never the commit hash, so the
# URL is stable for the life of the PR and each push replaces what it serves.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN   scoped to Cloudflare Pages: Edit
#   CLOUDFLARE_ACCOUNT_ID

name: Cloudflare Pages

on:
  push:
    branches: ["stable"]
    tags: ["*"]
  pull_request:

concurrency:
  group: cloudflare-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    # Fork PRs and dependabot cannot be given the deploy credentials.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup NodeJs
        uses: actions/setup-node@v4
        with:
          node-version: "24.14.1"
          cache: "npm"

      - run: npm ci && npm run web-build

      - name: Resolve deploy target
        id: target
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            branch="pr-${{ github.event.pull_request.number }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            branch="release"
          else
            branch="stable"
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "url=https://$branch.grid-editor.pages.dev" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "deploying to $branch"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy dist-web
            --project-name=grid-editor
            --branch=${{ steps.target.outputs.branch }}

      - name: Comment preview URL
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: cloudflare-preview
          message: |
            **Editor preview** — ${{ steps.target.outputs.url }}

            Deployed from `${{ steps.target.outputs.sha }}`. The URL stays the
            same for the life of this PR; each push replaces what it serves.
